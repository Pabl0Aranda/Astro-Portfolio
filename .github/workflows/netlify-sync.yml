name: Notion to Netlify Sync

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:

jobs:
  trigger-build:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar Netlify Build Hook
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          echo "Llamando al hook de Netlify..."
          curl -fsS -X POST -d "" "$NETLIFY_BUILD_HOOK"
          echo "¡Petición enviada!"